version: '3.8'

networks:
  sovereign-mesh:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  arbiter-backend:
    build:
      context: .
      dockerfile: Dockerfile.sovereign
    container_name: sovereign-arbiter-core
    restart: always
    networks:
      - sovereign-mesh
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://postgres:sovereign_secure@postgres-db:5432/sovereign_census
      - REDIS_URL=redis://redis-bus:6379
      - BASE_SEPOLIA_RPC_URL=https://sepolia.base.org
      - SOVEREIGN_ORACLE_CONTRACT=0x8f9E2B7c4d1A0e6F3c5B9a2D4E8f1C7b6A0d3E5F
    depends_on:
      - postgres-db
      - redis-bus
    volumes:
      - audit-logs:/app/data

  postgres-db:
    image: postgres:15-alpine
    container_name: sovereign-postgres
    restart: always
    networks:
      - sovereign-mesh
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sovereign_secure
      - POSTGRES_DB=sovereign_census
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sovereign_census_schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis-bus:
    image: redis:7-alpine
    container_name: sovereign-redis-bus
    restart: always
    networks:
      - sovereign-mesh

volumes:
  pgdata:
  audit-logs:
